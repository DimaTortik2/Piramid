<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>piramid</title>
    <style>
      body {
        margin: 0;
        padding: 0;
        background-color: #212121;
      }
      .perspective-container {
        perspective: 800px;
      }
      .circle-loader {
        transform-origin: center;
        animation: rotate-coin 3s linear infinite;
        will-change: transform;
      }
      @keyframes rotate-coin {
        0% {
          transform: rotateX(0deg) rotateY(0deg);
        }
        45% {
          transform: rotateX(70deg) rotateY(50deg);
        }
        50%,
        52% {
          transform: rotateX(75deg) rotateY(55deg);
        }
        100% {
          transform: rotateX(0deg) rotateY(0deg);
        }
      }
      .full-page-wrapper {
        width: 100vw;
        height: 100vh;
        height: 100dvh;
        background-color: #212121;

        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
      }
      .loader-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
      }
      .loader-container svg {
        width: calc((1vh + 1vw) * 15);
        height: calc((1vh + 1vw) * 15);
        color: #219644;
      }
      .loader-label {
        text-align: center;
        color: #ffffff77;
        font-weight: 600;
        font-family: sans-serif;
        font-size: 20px;
        line-height: 1.4;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="full-page-wrapper perspective-container">
        <div class="loader-container">
          <svg viewBox="0 0 200 200" stroke="currentColor">
            <circle
              cx="100"
              cy="100"
              r="80"
              fill="none"
              stroke-width="4"
              class="circle-loader"
            />
          </svg>
          <p class="loader-label">Грузимся...</p>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
